name: lexloop-ops

services:
  updater:
    image: lexloop-updater:${LEXLOOP_IMAGE_TAG}
    build:
      context: ..
      dockerfile: deploy/updater/Dockerfile
      args:
        DOCKER_CLI_IMAGE: ${DOCKER_CLI_IMAGE:-docker:27.5.1-cli}
        NODE_IMAGE: ${NODE_IMAGE:-node:22.14.0-bookworm-slim}
    container_name: lexloop-updater
    restart: unless-stopped
    environment:
      UPDATER_SOCKET: /opt/lexloop/data/run/updater.sock
      UPDATER_STATE_FILE: /opt/lexloop/data/updater/update-state.json
      REPOSITORY_URL: https://github.com/TangerineSpecter/Lexloop.git
      GITHUB_REPOSITORY: TangerineSpecter/Lexloop
      TRUSTED_BRANCH: master
      BARE_REPOSITORY: /opt/lexloop/source/repo.git
      RELEASES_DIR: /opt/lexloop/releases
      BACKUPS_DIR: /opt/lexloop/backups
      PRODUCTION_ENV: /opt/lexloop/config/production.env
      COMPOSE_PROJECT_NAME: lexloop
      APP_VERSION: ${APP_VERSION}
      APP_COMMIT_SHA: ${APP_COMMIT_SHA}
      LEXLOOP_IMAGE_TAG: ${LEXLOOP_IMAGE_TAG}
      CURRENT_RELEASE_PATH: ${CURRENT_RELEASE_PATH}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/lexloop:/opt/lexloop
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "const r=require('node:http').get({socketPath:process.env.UPDATER_SOCKET,path:'/status',timeout:3000},s=>{s.resume();if(s.statusCode!==200)process.exitCode=1});r.on('timeout',()=>r.destroy());r.on('error',()=>process.exitCode=1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks: [internal]

networks:
  internal:
    name: lexloop_internal
    external: true
